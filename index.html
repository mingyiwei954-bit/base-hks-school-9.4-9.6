<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3eb" />
    <meta name="description" content="在场——从一次搜索，遇见此刻恰好在场的人。" />
    <title>在场 · 搜索</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <main class="canvas" aria-label="在场主界面">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <header class="top-rail" aria-label="顶部导航">
        <a class="university-mark" href="#" aria-label="中国人民大学首页占位">
          <span class="emblem-crop" aria-hidden="true">
            <img src="https://www.ruc.edu.cn/template/1/out/imgs/VI/1.png" alt="" />
          </span>
          <span class="university-name">
            <strong>中国人民大学</strong>
            <small>RENMIN UNIVERSITY OF CHINA</small>
          </span>
        </a>

        <button class="login-trigger" id="loginTrigger" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.4"></circle>
            <path d="M5.8 20a6.2 6.2 0 0 1 12.4 0"></path>
          </svg>
          <span>登录</span>
        </button>
      </header>

      <section class="discovery-layer" aria-label="搜索栏目与结果">
        <nav class="verticals-shell" aria-label="Search Verticals">
          <div class="verticals-track" id="verticalsTrack" role="tablist" aria-label="搜索栏目">
            <button class="is-active" type="button" role="tab" aria-selected="true" data-vertical="综合">综合</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="校园">校园</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="课程">课程</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="活动">活动</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="社团">社团</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="同学">同学</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="资源">资源</button>
            <button type="button" role="tab" aria-selected="false" data-vertical="地点">地点</button>
          </div>
        </nav>

        <section class="serp-stage" aria-labelledby="serpTitle">
          <p class="serp-kicker">SERP · 自然搜索</p>
          <h1 id="serpTitle"><span id="verticalName">综合</span>栏目</h1>
          <p id="serpDescription">自然搜索结果将在这里呈现。当前只保留结果区域，不添加卡片或通用结果框架。</p>
        </section>
      </section>

      <section class="search-shell" id="searchShell" aria-label="搜索">
        <div class="search-widget" id="searchWidget">
          <div class="typing-mode" id="typingMode">
            <button class="search-action" id="searchAction" type="button" aria-label="展开搜索" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.2"></circle>
                <path d="m15.5 15.5 4.2 4.2"></path>
              </svg>
            </button>

            <label class="visually-hidden" for="searchInput">搜索一个需要、地点或兴趣</label>
            <input
              id="searchInput"
              type="search"
              placeholder="搜索一个需要、地点或兴趣"
              autocomplete="off"
              enterkeyhint="search"
            />

            <button class="utility-action" id="voiceAction" type="button" aria-label="切换到按住说话">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8.3" y="3.2" width="7.4" height="12" rx="3.7"></rect>
                <path d="M5.8 11.8a6.2 6.2 0 0 0 12.4 0M12 18v3M9.2 21h5.6"></path>
              </svg>
            </button>

            <button
              class="utility-action"
              id="photoAction"
              type="button"
              aria-label="打开图片搜索选项"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="photoMenu"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.5 6.5 9 4.2h6l1.5 2.3h2.2a2.3 2.3 0 0 1 2.3 2.3v8.9a2.3 2.3 0 0 1-2.3 2.3H5.3A2.3 2.3 0 0 1 3 17.7V8.8a2.3 2.3 0 0 1 2.3-2.3h2.2Z"></path>
                <circle cx="12" cy="13" r="3.5"></circle>
              </svg>
            </button>
          </div>

          <div class="voice-mode" id="voiceMode" aria-hidden="true" inert>
            <button class="voice-back" id="voiceBack" type="button" aria-label="返回文字搜索">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"></path></svg>
            </button>
            <button class="hold-to-talk" id="holdToTalk" type="button" aria-label="按住说话">
              <span class="voice-copy" id="voiceCopy">按住说话</span>
              <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            </button>
          </div>
        </div>

        <div class="photo-menu" id="photoMenu" role="menu" aria-label="图片搜索选项" aria-hidden="true">
          <button type="button" role="menuitem" data-photo-option="拍照">
            <span class="menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7.5 7 9 4.8h6L16.5 7h2A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-8A2.5 2.5 0 0 1 5.5 7h2Z"></path><circle cx="12" cy="13.2" r="3.4"></circle></svg>
            </span>
            <span><b>拍照</b><small>使用相机捕捉此刻</small></span>
          </button>
          <button type="button" role="menuitem" data-photo-option="从相册选择">
            <span class="menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.5"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m5.8 17 4.1-4.1 2.7 2.5 2.3-2.1 3.4 3.7"></path></svg>
            </span>
            <span><b>从相册选择</b><small>查找已有的照片</small></span>
          </button>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
        <span aria-hidden="true">·</span>
        <p id="toastMessage">搜索能力将在下一层接入</p>
      </div>
    </main>

    <dialog class="login-dialog" id="loginDialog" aria-labelledby="loginTitle">
      <div class="login-card">
        <button class="dialog-close" id="loginClose" type="button" aria-label="关闭登录窗口">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 6.5 11 11m0-11-11 11"></path></svg>
        </button>

        <div class="login-heading">
          <span class="login-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"></circle><path d="M5.8 20a6.2 6.2 0 0 1 12.4 0"></path></svg>
          </span>
          <div>
            <h1 id="loginTitle">用户登录</h1>
            <p>登录后继续使用你的个人空间</p>
          </div>
        </div>

        <div class="login-tabs" role="tablist" aria-label="登录方式">
          <button class="is-active" type="button" role="tab" aria-selected="true" data-login-mode="phone">手机号登录</button>
          <button type="button" role="tab" aria-selected="false" data-login-mode="email">邮箱登录</button>
        </div>

        <form class="login-form" id="loginForm">
          <label for="loginAccount" id="accountLabel">手机号</label>
          <input id="loginAccount" name="account" type="tel" inputmode="tel" autocomplete="tel" placeholder="请输入手机号" />

          <label for="loginSecret" id="secretLabel">验证码</label>
          <div class="secret-row">
            <input id="loginSecret" name="secret" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入验证码" />
            <button class="code-button" id="codeButton" type="button">获取验证码</button>
          </div>

          <button class="login-submit" type="submit">登录</button>
          <p class="login-note" id="loginNote" role="status" aria-live="polite">本阶段为界面占位，暂不连接真实账号。</p>
        </form>
      </div>
    </dialog>

    <script src="./app.js?v=6"></script>
  </body>
</html>
